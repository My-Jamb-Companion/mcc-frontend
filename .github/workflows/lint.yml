name: Lint & Type Check

on:
  push:
    branches: [main, staging, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            eslint-${{ runner.os }}-

      - name: Lint
        run: pnpm lint --cache --cache-location .eslintcache

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (diagnostic)
        run: |
          for pkg in packages/api packages/store packages/ui packages/features apps/admin apps/learner; do
            echo "=== Checking $pkg ==="
            cd "$GITHUB_WORKSPACE/$pkg"
            timeout 90 npx tsc --noEmit --extendedDiagnostics 2>&1 | tail -30
            echo "=== Done $pkg ==="
          done
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
