name: CI

on:
  push:
    # `testing` is where feature work lands and `main` is the deployed branch;
    # both were missing or wrong before, so pushes to the branches that matter
    # went unchecked.
    branches: [main, staging, testing]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Test, Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # 20.19+ is required: vitest 4 loads an ESM config through require(),
          # which older 20.x cannot do.
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Runs first: it is the fastest of the three and the one that had no
      # coverage at all. `next build` does not typecheck the apps, and
      # `turbo run typecheck` previously failed because no such task existed.
      - name: Typecheck
        run: pnpm turbo run typecheck --concurrency=2
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Test
        run: pnpm turbo run test --concurrency=2
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Build
        run: pnpm turbo run build --concurrency=2
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Lint
        run: pnpm lint
