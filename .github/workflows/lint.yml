name: Lint & Type Check

on:
  push:
    branches: [main, develop, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            eslint-${{ runner.os }}-

      - name: Lint
        run: pnpm lint --cache --cache-location .eslintcache

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore TypeScript build cache
        uses: actions/cache@v4
        with:
          path: "*.tsbuildinfo"
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/*.{ts,tsx}', '**/tsconfig*.json') }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Type check
        run: pnpm typecheck
