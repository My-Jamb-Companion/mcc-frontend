name: Lint & Type Check

on:
  push:
    branches: [main, staging, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 🔍 DEBUG: show turbo pipeline
      - name: Debug Turbo Tasks
        run: pnpm turbo run typecheck --dry-run

      # 🔍 DEBUG: show dependency graph
      - name: Debug Turbo Graph
        run: pnpm turbo run typecheck --graph

      # 🔍 DEBUG: check TS version
      - name: Check TypeScript Version
        run: pnpm tsc -v

      # 🔍 DEBUG: run a single app first
      - name: Typecheck Admin (isolated)
        run: pnpm --filter=admin typecheck

      - name: Typecheck Learner (isolated)
        run: pnpm --filter=learner typecheck

      # 🚀 Main run (with logs)
      - name: Type check (Turbo)
        run: pnpm turbo run typecheck --no-cache --concurrency=1 --output-logs=full
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          TURBO_TELEMETRY_DISABLED: 1
